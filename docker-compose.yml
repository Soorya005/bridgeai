version: "3.9"

services:
  llama-service:
    build: ./llama-service
    container_name: llama-service
    volumes:
      - ./models:/models
    ports:
      - "8001:8001"

  mcp-gateway:
    build: ./mcp-gateway
    container_name: mcp-gateway
    ports:
      - "8000:8000"
    depends_on:
      - llama-service
